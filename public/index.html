<meta charset="utf-8">
<title>Performance Hyper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#070D18; --bg2:#0A1424; --panel:#101E37; --panel2:#0D1830; --panel3:#0B1730; --line:#233151; --line2:#2B3B5E;
  --text:#EAF0FA; --muted:#93A3C2;
  --green:#6BEA56; --green2:#16C060; --bad:#FF7A86; --warn:#F5B860; --cy:#4CC3E8; --pu:#C9A7FF;
  --disp:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
:root.theme-light{
  --bg:#F6F8F6; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F4F1; --panel3:#EEF2ED; --line:#DFE6DE; --line2:#CBD6C9;
  --text:#10201A; --muted:#5B6B60;
  --green:#16A34A; --green2:#0E8F41; --bad:#D6455A; --warn:#B9790A; --cy:#1D7FA6; --pu:#7C5CC7;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px;line-height:1.55;padding-inline:0;padding-block:0;transition:background .2s ease,color .2s ease}
/* ---------- APP SHELL (sidebar + content) ---------- */
.app-shell{display:flex;align-items:flex-start;min-height:100vh}
.sidebar{width:256px;flex:none;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:22px;padding:22px 16px 18px;background:var(--bg2);border-right:1px solid var(--line);box-shadow:2px 0 24px rgba(0,0,0,.10)}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo{width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.brandtext{display:flex;flex-direction:column;line-height:1.2}
.brandtext b{font-family:var(--disp);font-weight:700;font-size:15px;letter-spacing:-.01em}
.brandtext span{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sidebar-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 2px}
.hstat{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 11px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease}
.hstat:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.12),0 2px 6px rgba(0,0,0,.08)}
.hstat b{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--text);font-variant-numeric:tabular-nums}
.hstat span{font-family:var(--mono);font-size:8.7px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.sidebar-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 6px 0;border-top:1px solid var(--line)}
.livewrap{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;color:var(--muted);min-width:0}
.livewrap span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb, var(--green) 25%, transparent);flex:none}
.dotlive.off{background:var(--muted);box-shadow:none}
.themebtn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .2s ease,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease;flex:none;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.themebtn:hover{border-color:var(--line2);transform:translateY(-2px) rotate(-8deg);box-shadow:0 6px 14px rgba(0,0,0,.14)}
.themebtn:active{transform:translateY(0) rotate(0)}
.themebtn svg{width:15px;height:15px}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.content{width:100%;max-width:920px;margin:0 auto;padding:36px 32px 24px;display:flex;flex-direction:column;gap:22px;flex:1}

/* ---------- TOOL SHELL ---------- */
nav.tabs{position:relative;display:flex;flex-direction:column;gap:2px}
#tabInd{position:absolute;top:0;left:0;background:var(--green);border-radius:8px;transition:transform .32s cubic-bezier(.65,0,.35,1),width .32s cubic-bezier(.65,0,.35,1),height .32s cubic-bezier(.65,0,.35,1);z-index:0;box-shadow:0 2px 10px color-mix(in srgb, var(--green) 45%, transparent)}
@media (prefers-reduced-motion:reduce){#tabInd{transition:none}}
nav.tabs button{position:relative;z-index:1;text-align:left;font:600 12.8px var(--body);color:var(--muted);background:transparent;border:none;border-radius:8px;padding:10px 12px;cursor:pointer;white-space:nowrap;transition:color .25s ease}
nav.tabs button.on{color:#08130A}
nav.tabs button:hover:not(.on){color:var(--text)}
h2{font-family:var(--disp);font-weight:600;font-size:18px;margin:0;letter-spacing:-.005em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);transition:box-shadow .25s ease,transform .25s cubic-bezier(.2,.8,.2,1)}
.card:hover{box-shadow:0 4px 14px rgba(0,0,0,.08),0 14px 32px rgba(0,0,0,.07)}
#view{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both}
#view>*{animation:viewIn .45s cubic-bezier(.2,.8,.2,1) both}
#view.no-anim>*{animation:none}
#view>*:nth-child(1){animation-delay:0s}
#view>*:nth-child(2){animation-delay:.05s}
#view>*:nth-child(3){animation-delay:.1s}
#view>*:nth-child(4){animation-delay:.15s}
#view>*:nth-child(n+5){animation-delay:.18s}
@keyframes viewIn{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (prefers-reduced-motion:reduce){#view>*{animation:none}}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
label.f span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
input,select,textarea{background:var(--panel3);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:500 13.5px var(--body);width:100%;transition:border-color .2s ease,box-shadow .2s ease}
textarea{resize:vertical;min-height:60px;font-weight:400}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus-visible,select:focus-visible,textarea:focus-visible{border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent);outline:none}
button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.btn{font:600 13px var(--body);border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 16px;border-radius:8px;cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),filter .15s ease,border-color .15s ease,box-shadow .18s ease;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.btn.primary{background:var(--green);color:#08130A;border-color:var(--green);box-shadow:0 2px 8px color-mix(in srgb, var(--green) 35%, transparent)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb, var(--bad) 40%, transparent)}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.btn.primary:hover{box-shadow:0 6px 18px color-mix(in srgb, var(--green) 45%, transparent)}
.btn:active{transform:translateY(0) scale(.97);transition-duration:.08s}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.row-actions{display:flex;gap:8px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-radius:10px;padding:13px 14px;background:var(--panel3);display:flex;flex-direction:column;gap:8px;transition:border-color .2s ease,transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease}
.item:hover{border-color:var(--line2);transform:translateY(-2px) translateX(1px);box-shadow:0 6px 16px rgba(0,0,0,.10)}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.item .nm{font-family:var(--disp);font-weight:700;font-size:15.5px}
.chip{display:inline-flex;align-items:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:2px 8px;border-radius:99px;background:color-mix(in srgb, var(--text) 8%, transparent);color:var(--muted)}
.chip.c{background:color-mix(in srgb, var(--c) 20%, transparent);color:var(--c)}
.meta{color:var(--muted);font-size:12px}
.empty{color:var(--muted);font-size:12.5px;font-style:italic;padding:18px 4px;text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px;font-variant-numeric:tabular-nums}
th{font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);font-size:13px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:color-mix(in srgb, var(--text) 4%, transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 9px;border-radius:99px}
.pill.hi{background:color-mix(in srgb, var(--green) 18%, transparent);color:var(--green)}
.pill.mid{background:color-mix(in srgb, var(--cy) 18%, transparent);color:var(--cy)}
.pill.lo{background:color-mix(in srgb, var(--warn) 18%, transparent);color:var(--warn)}
.pill.crit{background:color-mix(in srgb, var(--bad) 18%, transparent);color:var(--bad)}
.scale{display:flex;gap:6px}
.scale button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--text);font:600 13px var(--mono);cursor:pointer;transition:all .18s cubic-bezier(.2,.8,.2,1)}
.scale button:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.10)}
.scale button.sel{background:var(--green);color:#08130A;border-color:var(--green);transform:scale(1.08);box-shadow:0 4px 12px color-mix(in srgb, var(--green) 45%, transparent)}
.boolbtns{display:flex;gap:8px}
.boolbtns button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel3);color:var(--text);font:600 12.5px var(--body);cursor:pointer;transition:all .18s cubic-bezier(.2,.8,.2,1)}
.boolbtns button:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.10)}
.boolbtns button.selY.sel{background:var(--green);color:#08130A;border-color:var(--green);box-shadow:0 4px 12px color-mix(in srgb, var(--green) 45%, transparent)}
.boolbtns button.selN.sel{background:var(--bad);color:#2a0808;border-color:var(--bad);box-shadow:0 4px 12px color-mix(in srgb, var(--bad) 45%, transparent)}
.critrow{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel3);display:flex;flex-direction:column;gap:8px}
.critrow .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.critrow .top b{font-family:var(--body);font-size:13.5px}
.bar{height:10px;background:color-mix(in srgb, var(--text) 6%, transparent);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
@media (max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:border-color .2s ease,transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;box-shadow:0 2px 6px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.04)}
.kpi:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.10),0 2px 6px rgba(0,0,0,.06)}
.kpi .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--disp);font-weight:700;font-size:28px;margin-top:4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters label.f{min-width:150px;flex:1}
.detail{border-top:1px solid var(--line);padding-top:12px;margin-top:2px;display:flex;flex-direction:column;gap:8px}
.banner{background:color-mix(in srgb, var(--warn) 14%, transparent);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:12.5px}
footer{border-top:1px solid var(--line);padding:16px 32px 32px;max-width:920px;margin:0 auto;width:100%;box-sizing:border-box;color:var(--muted);font-family:var(--mono);font-size:11px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
[hidden]{display:none!important}
#toasts{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:8px;z-index:50;max-width:min(340px,calc(100vw - 36px))}
.toast{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:10px 14px;font-size:12.5px;color:var(--text);box-shadow:0 12px 32px rgba(0,0,0,.32),0 2px 8px rgba(0,0,0,.18);opacity:0;transform:translateY(10px) scale(.96);transition:opacity .3s cubic-bezier(.2,.8,.2,1),transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{opacity:1;transform:translateY(0) scale(1)}
.toast.ok{border-color:color-mix(in srgb, var(--green) 55%, transparent)}
.toast.warn{border-color:color-mix(in srgb, var(--warn) 55%, transparent);color:var(--warn)}
.preview{display:flex;align-items:center;gap:18px;border:1px solid var(--line);background:var(--panel3);border-radius:10px;padding:14px 16px;margin-top:14px;flex-wrap:wrap}
.preview .num{font-family:var(--disp);font-weight:700;font-size:32px;color:var(--green);min-width:78px}
.preview .prog{flex:1;min-width:160px}
.preview .prog .bar{height:8px}
.preview .prog span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr}}
.legend{display:flex;flex-direction:column;gap:8px;justify-content:center}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.perf-tile{display:flex;justify-content:space-between;align-items:center;gap:10px}
.perf-tile .nm{font-family:var(--disp);font-weight:700;font-size:15px}
.cta-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
@media (max-width:900px){
  .app-shell{flex-direction:column}
  .sidebar{position:relative;width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);padding:12px 14px;gap:10px}
  .brand{order:1;padding:0}
  .sidebar-footer{order:2;margin-top:0;border-top:none;padding:0}
  nav.tabs{order:3;flex-direction:row;flex-wrap:nowrap;width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{padding:9px 13px;flex:none}
  .sidebar-stats{order:4;width:100%;grid-template-columns:repeat(4,1fr)}
  .content{padding:20px 16px 18px;gap:18px}
  footer{padding:14px 16px 24px}
}
@media (max-width:600px){
  body{font-size:13.5px}
  .content{padding:16px 14px 16px;gap:16px}
  h2{font-size:16.5px}
  .card{padding:16px}
  .sidebar-stats{grid-template-columns:1fr 1fr}
  .hstat b{font-size:16px}
  .kpis{grid-template-columns:1fr 1fr}
  .btn{padding:11px 14px;min-height:42px}
  .scale button{width:40px;height:40px}
  .boolbtns button{padding:12px}
  .themebtn{width:36px;height:36px}
  .preview{padding:12px 14px;gap:12px}
  .preview .num{font-size:26px;min-width:64px}
  footer{flex-direction:column;align-items:flex-start;gap:4px}
}
@media (max-width:400px){.kpis{grid-template-columns:1fr}}
</style>

function applyTheme(mode){
  document.documentElement.classList.toggle('theme-light',mode==='light');
  var btn=document.getElementById('themeBtn'); if(btn) btn.innerHTML=mode==='light'?MOON:SUN;
  try{localStorage.setItem('hc_theme',mode)}catch(e){}
}
(function initTheme(){
  var saved='dark'; try{saved=localStorage.getItem('hc_theme')||'dark'}catch(e){}
  applyTheme(saved);
})();

var TABS=[['funcoes','Funções'],['criterios','Critérios'],['colab','Colaboradores'],['aval','Avaliar'],['painel','Painel executivo'],['estrategico','Estratégico']];
function toast(msg,type){
  var box=document.getElementById('toasts'); if(!box) return;
  var el=document.createElement('div'); el.className='toast '+(type||'ok'); el.textContent=msg;
  box.appendChild(el); requestAnimationFrame(function(){el.classList.add('on')});
  setTimeout(function(){el.classList.remove('on'); setTimeout(function(){el.remove()},300)},4200);
}
function cv(name){
  var v=getComputedStyle(document.documentElement).getPropertyValue(name);
  return (v||'').trim()||'#93A3C2';
}
var tab='funcoes';

var PDI_LABEL={nao_iniciado:'Não iniciado',em_andamento:'Em andamento',concluido:'Concluído'};
var TRILHA_LABEL={nao_iniciado:'Não iniciada',em_andamento:'Em andamento',concluido:'Concluída'};
var READINESS_LABEL={emergente:'Emergente',em_desenvolvimento:'Em desenvolvimento',pronto:'Pronto agora'};

var CAT_COLORS={};
var PALETTE=['#6BEA56','#4CC3E8','#C9A7FF','#F5B860','#FF7A86','#5EEAD4'];
function colorFor(key,map){
  if(!map[key]){var n=Object.keys(map).length;map[key]=PALETTE[n%PALETTE.length];}
  return map[key];
}
function uid(){return (crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function nf1(x){return (Math.round(x*10)/10).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})}

function roleName(id){var r=ROLES.filter(function(r){return r.id===id})[0];return r?r.name:'—'}
function critsForRole(id){return CRITERIA.filter(function(c){return c.roleId===id})}

/* ---------- PROGRAMA EXCELÊNCIA HYPER (modelo padrão de critérios) ---------- */
var EXCELENCIA_CAT='Programa Excelência';
var EXCELENCIA_TEMPLATE=[
  {name:'Qualidade e consistência dos dados/entregas',type:'scale',weight:3,desc:'Precisão, padronização e confiabilidade do que é entregue'},
  {name:'Iniciativa em melhoria de processos',type:'scale',weight:3,desc:'Propôs e aplicou uma melhoria de processo no período'},
  {name:'Cumprimento de prazos e metas',type:'scale',weight:3,desc:'Entregou dentro do prazo combinado'},
  {name:'Colaboração e apoio à equipe',type:'scale',weight:3,desc:'Trabalho em equipe, troca de conhecimento, apoio a colegas'},
  {name:'Compartilhamento de conhecimento',type:'scale',weight:2,desc:'Mentoria, treinamento de alguém ou documentação de processo'},
  {name:'Zero atrasos/faltas não justificadas',type:'bool',weight:1,desc:'Assiduidade no período avaliado'},
  {name:'Não gerou retrabalho por erro evitável',type:'bool',weight:2,desc:'Qualidade de dados/processos sem reincidência de erro já apontado'},
  {name:'Postura colaborativa com o time',type:'bool',weight:2,desc:'Não reteve informação nem atrapalhou o trabalho coletivo'},
  {name:'Observações do avaliador',type:'texto',weight:1,desc:'Destaques e pontos de atenção do período'},
];
function applyExcelenciaTemplate(roleId){
  var existentes=critsForRole(roleId).map(function(c){return c.name});
  EXCELENCIA_TEMPLATE.forEach(function(t){
    if(existentes.indexOf(t.name)!==-1) return;
    addDoc('criteria',{roleId:roleId,name:t.name,category:EXCELENCIA_CAT,type:t.type,weight:t.weight,desc:t.desc,createdAt:Date.now()},true);
  });
  toast('Critérios do Programa Excelência aplicados','ok');
}
function empName(id){var e=EMPLOYEES.filter(function(e){return e.id===id})[0];return e?e.name:'—'}
function empById(id){return EMPLOYEES.filter(function(e){return e.id===id})[0]}
function leaderName(id){if(!id)return '—';var e=empById(id);return e?e.name:'—'}
function moneyFmt(v){if(v==null||v==='')return '—';return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function dateFmt(v){if(!v)return '—';var d=new Date(v+(String(v).length<=10?'T00:00:00':''));if(isNaN(d))return v;return d.toLocaleDateString('pt-BR')}
function onboardingProgress(e){var n=(e.onboarding30?1:0)+(e.onboarding60?1:0)+(e.onboarding90?1:0);return n}

function critScore(c,val){
  if(val==null||val==='') return null;
  if(c.type==='bool') return val===true?100:0;
  var n=Number(val); if(isNaN(n)) return null;
  return (n-1)/4*100;
}
function evalFinalScore(ev){
  var cs=critsForRole(ev.roleId); var total=0,wsum=0;
  cs.forEach(function(c){
    var s=ev.scores&&ev.scores[c.id];
    var sc=s?critScore(c,s.value):null;
    if(sc==null) return;
    var w=Number(c.weight)||0;
    total+=sc*w; wsum+=w;
  });
  return wsum>0?total/wsum:null;
}
function excelenciaScore(ev){
  var cs=critsForRole(ev.roleId).filter(function(c){return c.category===EXCELENCIA_CAT});
  var total=0,wsum=0;
  cs.forEach(function(c){
    var s=ev.scores&&ev.scores[c.id];
    var sc=s?critScore(c,s.value):null;
    if(sc==null) return;
    var w=Number(c.weight)||0;
    total+=sc*w; wsum+=w;
  });
  return wsum>0?total/wsum:null;
}
function scorePill(v){
  if(v==null) return '<span class="pill mid">sem nota</span>';
  var cls=v>=85?'hi':v>=70?'mid':v>=50?'lo':'crit';
  var lbl=v>=85?'Destaque':v>=70?'Dentro do esperado':v>=50?'Atenção':'Crítico';
  return '<span class="pill '+cls+'">'+nf1(v)+'% · '+lbl+'</span>';
}
function ctaGoRole(msg){
  return '<div class="card cta-card"><h2>Nenhuma função cadastrada ainda</h2><p class="meta" style="margin:0">'+esc(msg)+'</p>'+
    '<button class="btn primary" id="ctaGoFuncoes">Cadastrar a primeira função</button></div>';
}
function wireCta(){
  var b=document.getElementById('ctaGoFuncoes');
  if(b) b.addEventListener('click',function(){tab='funcoes';updateTabsUI();render();});
}

var tabsBuilt=false;
function buildTabsOnce(){
  if(tabsBuilt) return;
  var nav=document.getElementById('tabs');
  nav.innerHTML='<div id="tabInd"></div>'+TABS.map(function(t){
    return '<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'">'+t[1]+'</button>';
  }).join('');
  [].forEach.call(nav.querySelectorAll('button'),function(b){
    b.addEventListener('click',function(){tab=b.dataset.t;updateTabsUI();render();});
  });
  tabsBuilt=true;
  window.addEventListener('resize',positionIndicator);
}
function updateTabsUI(){
  [].forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
    b.classList.toggle('on',b.dataset.t===tab);
  });
  positionIndicator();
}
function positionIndicator(){
  var on=document.querySelector('nav.tabs button.on');
  var ind=document.getElementById('tabInd');
  if(!on||!ind) return;
  ind.style.width=on.offsetWidth+'px';
  ind.style.height=on.offsetHeight+'px';
  ind.style.transform='translate('+on.offsetLeft+'px,'+on.offsetTop+'px)';
}

function confirmBtn(label,onYes,cls){
  var id='cb'+Math.random().toString(36).slice(2);
  setTimeout(function(){
    var el=document.getElementById(id); if(!el) return;
    el.addEventListener('click',function(){
      if(el.dataset.armed==='1'){onYes();}
      else{el.dataset.armed='1';el.textContent='Confirmar?';el.classList.add('danger');
        setTimeout(function(){if(el){el.dataset.armed='0';el.textContent=label;el.classList.remove('danger');}},3500);}
    });
  },0);
  return '<button class="btn '+(cls||'ghost')+'" id="'+id+'" data-armed="0">'+esc(label)+'</button>';
}

    html+='<div class="list">'+ROLES.map(function(r){

/* ---------- AVALIAR ---------- */
function draftScorePreview(cs){
  var total=0,wsum=0,filled=0;
  cs.forEach(function(c){
    var s=draft.scores[c.id]; var v=s?s.value:null;
    var sc=critScore(c,v); if(sc==null) return;
    filled++; var w=Number(c.weight)||0; total+=sc*w; wsum+=w;
  });
  return {score:wsum>0?total/wsum:null, filled:filled, total:cs.length};
}
function viewAval(){
  if(!ROLES.length){document.getElementById('view').innerHTML=ctaGoRole('Cadastre uma função e um colaborador antes de lançar avaliações.');wireCta();return;}

            '<button data-c="'+c.id+'" data-v="0" class="bov selN'+(s.value===false?' sel':'')+'">Não</button></div>';

      '</tbody></table></div>';

  [].forEach.call(document.querySelectorAll('.scv'),function(b){
    b.addEventListener('click',function(){
      var cid=b.dataset.c; draft.scores[cid]=draft.scores[cid]||{};
      draft.scores[cid].value=Number(b.dataset.v); render();
    });
  });
  [].forEach.call(document.querySelectorAll('.bov'),function(b){
    b.addEventListener('click',function(){
      var cid=b.dataset.c; draft.scores[cid]=draft.scores[cid]||{};
      draft.scores[cid].value=b.dataset.v==='1'; render();
    });

  [].forEach.call(document.querySelectorAll('.txv'),function(t){

  var iw=w-padL-padR;
  var rows=items.map(function(it,i){
    var y=padT+i*rowH;
    var bw=iw*(Math.max(0,Math.min(100,it.value||0))/100);
    return '<text x="'+(padL-10)+'" y="'+(y+14)+'" text-anchor="end" font-family="Inter" font-size="12" fill="'+muted+'">'+esc(it.label)+'</text>'+
      '<rect x="'+padL+'" y="'+y+'" width="'+iw+'" height="18" rx="4" fill="'+muted+'" opacity=".12"></rect>'+
      (it.value==null?'':'<rect x="'+padL+'" y="'+y+'" width="'+bw.toFixed(1)+'" height="18" rx="4" fill="'+it.color+'"></rect>')+
      '<text x="'+(padL+iw+8)+'" y="'+(y+14)+'" font-family="JetBrains Mono" font-size="11.5" fill="'+text+'">'+(it.value==null?'sem dados':nf1(it.value)+'%')+'</text>';
  }).join('');
  var grid=[0,25,50,75,100].map(function(g){
    var x=padL+iw*(g/100);
    return '<line x1="'+x.toFixed(1)+'" y1="2" x2="'+x.toFixed(1)+'" y2="'+(h-16)+'" stroke="'+muted+'" opacity=".18"></line>'+
      '<text x="'+x.toFixed(1)+'" y="'+(h-4)+'" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="'+muted+'">'+g+'</text>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+grid+rows+'</svg>';
}
function svgDonut(segs){
  var muted=cv('--muted'),text=cv('--text');
  var total=segs.reduce(function(a,s){return a+s.count},0);
  var r=52,c=2*Math.PI*r,cx=70,cy=70,offset=0;
  var circles=!total?'':segs.filter(function(s){return s.count>0}).map(function(s){
    var frac=s.count/total, dash=frac*c;
    var el='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="17" stroke-dasharray="'+dash.toFixed(2)+' '+(c-dash).toFixed(2)+'" stroke-dashoffset="'+(-offset).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"></circle>';
    offset+=dash; return el;
  }).join('');
  return '<svg viewBox="0 0 140 140" style="width:140px;height:140px;flex:none">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+muted+'" opacity=".2" stroke-width="17"></circle>'+
    '<g>'+circles+'</g>'+
    '<text x="70" y="65" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="'+muted+'">avaliações</text>'+
    '<text x="70" y="88" text-anchor="middle" font-family="Plus Jakarta Sans" font-weight="700" font-size="26" fill="'+text+'">'+total+'</text></svg>';
}
function svgTrend(points){
  var muted=cv('--muted'),green=cv('--green');
  var w=560,h=140,padL=32,padR=14,padT=12,padB=24,iw=w-padL-padR,ih=h-padT-padB;
  var stepX=points.length>1?iw/(points.length-1):0;
  function xAt(i){return padL+stepX*i}
  function yAt(v){return padT+ih*(1-Math.max(0,Math.min(100,v||0))/100)}
  var path=points.map(function(p,i){return (i===0?'M':'L')+xAt(i).toFixed(1)+','+yAt(p.value).toFixed(1)}).join(' ');
  var area=path+' L'+xAt(points.length-1).toFixed(1)+','+(padT+ih)+' L'+xAt(0).toFixed(1)+','+(padT+ih)+' Z';
  var grid=[0,50,100].map(function(g){var y=yAt(g);return '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="'+muted+'" opacity=".18"></line><text x="'+(padL-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-family="JetBrains Mono" font-size="9.5" fill="'+muted+'">'+g+'</text>';}).join('');
  var dots=points.map(function(p,i){return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(p.value).toFixed(1)+'" r="3.5" fill="'+green+'"></circle><text x="'+xAt(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-family="JetBrains Mono" font-size="9.5" fill="'+muted+'">'+esc(p.label)+'</text>';}).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:auto;display:block">'+
    '<defs><linearGradient id="trendFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+green+'" stop-opacity=".32"/><stop offset="100%" stop-color="'+green+'" stop-opacity="0"/></linearGradient></defs>'+
    grid+'<path d="'+area+'" fill="url(#trendFill)" stroke="none"></path><path d="'+path+'" fill="none" stroke="'+green+'" stroke-width="2.5"></path>'+dots+'</svg>';
}

function toCsv(headers,rows){
  var all=[headers].concat(rows);
  return all.map(function(r){return r.map(function(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
}
function downloadCsv(csv,filename){
  var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

/* ---------- STATS (count-up) ---------- */
var lastHeroVals={roles:-1,emp:-1,eval:-1,avg:null};
function countUp(el,to){
  var from=Number(el.dataset.v||0); if(from===to){el.textContent=to;return;}
  el.dataset.v=to;
  var dur=500,start=null;
  function step(ts){
    if(!start)start=ts;
    var p=Math.min(1,(ts-start)/dur);
    var v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));
    el.textContent=v;
    if(p<1)requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function updateHeroStats(){
  var nRoles=ROLES.length, nEmp=EMPLOYEES.filter(function(e){return e.status!=='inativo'}).length, nEval=EVALS.length;
  var scored=EVALS.map(evalFinalScore).filter(function(v){return v!=null});
  var avg=scored.length?scored.reduce(function(a,b){return a+b},0)/scored.length:null;
  if(nRoles!==lastHeroVals.roles){countUp(document.getElementById('hs_roles'),nRoles);lastHeroVals.roles=nRoles;}
  if(nEmp!==lastHeroVals.emp){countUp(document.getElementById('hs_emp'),nEmp);lastHeroVals.emp=nEmp;}
  if(nEval!==lastHeroVals.eval){countUp(document.getElementById('hs_eval'),nEval);lastHeroVals.eval=nEval;}
  if(avg!==lastHeroVals.avg){document.getElementById('hs_avg').textContent=avg==null?'—':nf1(avg)+'%';lastHeroVals.avg=avg;}
}

/* PROTEÇÃO GERAL CONTRA PERDA DE DADOS AO DIGITAR: qualquer render() recria
   do zero o HTML de dentro de #view, então qualquer campo (input/select/
   textarea) editável perderia o que está sendo digitado nele - não importa
   o que disparou esse render() (sync em segundo plano, salvar outro campo
   da mesma tela, excluir um item, aplicar um template, trocar o tema...).
   Por isso, ANTES de redesenhar, guardamos o valor atual de cada campo (e
   qual deles está com foco + posição do cursor) e, DEPOIS de redesenhar,
   devolvemos esses valores e o foco para os campos correspondentes. */
function formFieldKey(el){
  if(el.id) return 'id:'+el.id;
  if(el.dataset){
    var ks=[]; for(var k in el.dataset){ if(Object.prototype.hasOwnProperty.call(el.dataset,k)) ks.push(k); }
    if(ks.length){
      ks.sort();
      var parts=[]; for(var i=0;i<ks.length;i++) parts.push(ks[i]+'='+el.dataset[ks[i]]);
      return 'd:'+el.tagName+':'+parts.join('&');
    }
  }
  return null;
}
function captureFormState(){
  var v=document.getElementById('view'); if(!v) return null;
  var active=document.activeElement;
  var out={fields:{},activeKey:null,selStart:null,selEnd:null};
  var els=v.querySelectorAll('input,textarea,select');
  for(var i=0;i<els.length;i++){
    var el=els[i], key=formFieldKey(el); if(!key) continue;
    if(el.type==='checkbox'||el.type==='radio') out.fields[key]={c:el.checked};
    else out.fields[key]={v:el.value};
    if(el===active){
      out.activeKey=key;
      if(typeof el.selectionStart==='number'){ out.selStart=el.selectionStart; out.selEnd=el.selectionEnd; }
    }
  }
  return out;
}
function restoreFormState(fs){
  if(!fs) return;
  var v=document.getElementById('view'); if(!v) return;
  var els=v.querySelectorAll('input,textarea,select'), toFocus=null;
  for(var i=0;i<els.length;i++){
    var el=els[i], key=formFieldKey(el); if(!key) continue;
    var st=fs.fields[key]; if(!st) continue;
    if(el.type==='checkbox'||el.type==='radio') el.checked=st.c;
    else el.value=st.v;
    if(key===fs.activeKey) toFocus=el;
  }
  if(toFocus){
    toFocus.focus();
    if(fs.selStart!=null && typeof toFocus.setSelectionRange==='function'){
      try{ toFocus.setSelectionRange(fs.selStart,fs.selEnd); }catch(e){}
    }
  }
}

/* o usuário pode estar digitando em qualquer campo dentro de #view (nome de
   função, critério, comentário de avaliação, etc.) no exato momento em que a
   sincronização em segundo plano (boot ou o polling de 20s) tenta atualizar a
   tela. Nesse caso evitamos redesenhar agora (mesmo com a proteção acima,
   isso evita reiniciar a animação de entrada/piscar a tela sem necessidade
   enquanto a pessoa está digitando). Os dados novos ficam guardados e a tela
   é atualizada assim que o campo perder o foco. */
var pendingBackgroundRender=false;
function isEditingInView(){
  var v=document.getElementById('view');
  var a=document.activeElement;
  return !!(v && a && v.contains(a) && a!==v && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT'));
}
document.addEventListener('focusout',function(e){
  if(!pendingBackgroundRender) return;
  var v=document.getElementById('view');
  if(!v || !v.contains(e.target)) return;
  setTimeout(function(){
    if(pendingBackgroundRender && !isEditingInView()){
      pendingBackgroundRender=false;
      render();
    }
  },80);
},true);

/* ---------- CACHE LOCAL (resiliência) ---------- */
function saveCache(){
  try{localStorage.setItem('hc_perf_cache',JSON.stringify({roles:ROLES,criteria:CRITERIA,employees:EMPLOYEES,evaluations:EVALS,climate:CLIMATE,succession:SUCCESSION,highlights:HIGHLIGHTS}))}catch(e){}
}
function loadCache(){
  try{var raw=localStorage.getItem('hc_perf_cache'); return raw?JSON.parse(raw):null}catch(e){return null}
}

/* ---------- DB WIRING (Netlify Functions + Postgres via /api) ---------- */
var COL_LABEL={roles:'Função',criteria:'Critério',employees:'Colaborador',evaluations:'Avaliação',climate:'Indicador de clima',succession:'Sucessor',highlights:'Destaque'};
var SYNC_OK=false;
function arrFor(col){return {roles:ROLES,criteria:CRITERIA,employees:EMPLOYEES,evaluations:EVALS,climate:CLIMATE,succession:SUCCESSION,highlights:HIGHLIGHTS}[col]}
function apiList(col){
  return fetch(API_BASE+'/'+col).then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});
}
function apiCreate(col,data){
  return fetch(API_BASE+'/'+col,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});
}
function apiUpdate(col,data){
  return fetch(API_BASE+'/'+col,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});
}
function apiDelete(col,id){
  return fetch(API_BASE+'/'+col+'?id='+encodeURIComponent(id),{method:'DELETE'})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json();});
}
function addDoc(col,data,silent){
  var label=COL_LABEL[col]||'Registro';
  apiCreate(col,data).then(function(row){
    arrFor(col).push(row); saveCache(); render();
    if(!silent) toast(label+' salva.');
  }).catch(function(err){
    arrFor(col).push(Object.assign({id:uid()},data)); saveCache(); render();
    toast('Não consegui sincronizar essa '+label.toLowerCase()+' ('+(err&&err.message?err.message:'erro')+'). Fica salva só neste dispositivo.','warn');
  });
}
function updateDoc(col,data,silent){
  var label=COL_LABEL[col]||'Registro';
  var arr=arrFor(col);
  var idx=arr.findIndex(function(x){return x.id===data.id});
  var prev=idx>-1?Object.assign({},arr[idx]):null;
  if(idx>-1){arr[idx]=Object.assign({},arr[idx],data); saveCache(); render();}
  apiUpdate(col,data).then(function(row){
    var j=arr.findIndex(function(x){return x.id===data.id}); if(j>-1)arr[j]=row;
    saveCache(); render();
    if(!silent) toast(label+' atualizado(a).');
  }).catch(function(err){
    toast('Não consegui sincronizar essa alteração de '+label.toLowerCase()+' ('+(err&&err.message?err.message:'erro')+'). Fica salva só neste dispositivo.','warn');
  });
}
function delDoc(col,id){
  var label=COL_LABEL[col]||'Registro';
  var arr=arrFor(col);
  apiDelete(col,id).then(function(){
    var j=arr.findIndex(function(x){return x.id===id}); if(j>-1)arr.splice(j,1);
    saveCache(); render();
    toast(label+' excluída.');
  }).catch(function(err){
    toast('Não consegui excluir essa '+label.toLowerCase()+' ('+(err&&err.message?err.message:'erro')+').','warn');
  });
}
function refreshAll(silentFail){
  return Promise.all([apiList('roles'),apiList('criteria'),apiList('employees'),apiList('evaluations'),apiList('climate'),apiList('succession'),apiList('highlights')])
    .then(function(r){
      ROLES=r[0];CRITERIA=r[1];EMPLOYEES=r[2];EVALS=r[3];CLIMATE=r[4];SUCCESSION=r[5];HIGHLIGHTS=r[6];
      saveCache();
      if(silentFail && isEditingInView()){ pendingBackgroundRender=true; }
      else { pendingBackgroundRender=false; render(); }
    }).catch(function(err){
      if(!silentFail) toast('Não consegui atualizar os dados do time ('+(err&&err.message?err.message:'erro')+').','warn');
    });
}

(function boot(){
  var cache=loadCache();
  if(cache){ROLES=cache.roles||[];CRITERIA=cache.criteria||[];EMPLOYEES=cache.employees||[];EVALS=cache.evaluations||[];CLIMATE=cache.climate||[];SUCCESSION=cache.succession||[];HIGHLIGHTS=cache.highlights||[];}
  render();
  document.getElementById('themeBtn').addEventListener('click',function(){
    applyTheme(document.documentElement.classList.contains('theme-light')?'dark':'light');
    render();
  });
  var dot=document.getElementById('liveDot'), txt=document.getElementById('liveTxt');
  refreshAll(true).then(function(){
    SYNC_OK=true;
    txt.textContent='sincronizado com o time';
    document.getElementById('footStatus').textContent='sincronizado com o time';
    setInterval(function(){refreshAll(true)},20000);
  }).catch(function(){
    dot.classList.add('off');
    txt.textContent='sem sincronização — dados só neste dispositivo';
    document.getElementById('footStatus').textContent='sem sincronização com o time';
  });
})();
